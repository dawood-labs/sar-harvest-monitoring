# All settings live here, not in the code. Copy to config.yaml and fill in.
aoi: myaoi                                             # short lower-case name used in file names
season: {start: "YYYY-MM-DD", end: "YYYY-MM-DD"}       # one week before the crop-mask date -> after the last report date
crs: {work: "EPSG:XXXXX", deliver: "EPSG:4326"}        # work = local UTM zone (area in metres)
classes: {remaining_cane: 81, harvested: 82, cloud: 232}   # codes written in the field `predicted`
min_piece_acres: 0.2                                   # pieces smaller than this are treated as slivers
report_dates: ["YYYY-MM-DD"]                           # dates a harvest report is needed for
paths:
  raw: data/raw
  reference_reports: data/raw/reference_reports        # crop mask + older harvest reports (read-only)
  interim: data/interim
  final: data/final
  bucket: ""                                           # permanent storage; the machine disk is temporary
seed: 42
gee: {key_file: "", project: ""}                       # Earth Engine service-account key and project
crop_mask: ""                                          # polygons of standing cane at the start of the season
s1_tracks: {}                                          # relative orbit: DESCENDING | ASCENDING (see src/s1_passes.py)
s2_bands: [B2, B3, B4, B5, B8]                         # optical bands, used only to check results
gee_workload_tag: harvest-sar                          # label under which Earth Engine compute is metered
